<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — AI News Digest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4 font-sans antialiased">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-bold text-indigo-600">AI News Digest</a>
      <p class="text-gray-500 text-sm mt-1">Create your account and pick your sector</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div id="errorMsg" class="hidden mb-5 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>

      <form id="registerForm" class="space-y-5">
        <!-- Full name -->
        <div>
          <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
          <input type="text" id="fullName" name="fullName" required autocomplete="name"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Work email</label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="password" name="password" required minlength="8"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm
                        focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" />
          <p class="text-xs text-gray-400 mt-1">At least 8 characters</p>
        </div>

        <!-- Sector -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Your sector</label>
          <div class="grid grid-cols-2 gap-2" id="sectorGrid">
            <!-- Populated by JS -->
          </div>
          <input type="hidden" id="selectedSector" name="sector" value="general" />
        </div>

        <!-- Submit -->
        <button type="submit" id="submitBtn"
                class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl
                       hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
          Create account & continue to payment →
        </button>
      </form>

      <p class="mt-5 text-center text-sm text-gray-500">
        Already have an account?
        <a href="/" class="text-indigo-600 font-medium hover:underline">Log in</a>
      </p>
    </div>

    <p class="mt-6 text-center text-xs text-gray-400">
      By signing up you agree to our Terms of Service.<br />
      Payments are handled securely by Stripe.
    </p>
  </div>

  <script>
    const SECTORS = [
      { value: 'retail',     label: '🛍️ Retail' },
      { value: 'telecom',    label: '📡 Telecom' },
      { value: 'marketing',  label: '📣 Marketing' },
      { value: 'finance',    label: '💰 Finance' },
      { value: 'healthcare', label: '🏥 Healthcare' },
      { value: 'logistics',  label: '🚚 Logistics' },
      { value: 'hr',         label: '👥 HR' },
      { value: 'legal',      label: '⚖️ Legal' },
      { value: 'education',  label: '🎓 Education' },
      { value: 'general',    label: '🤖 General AI' },
    ];

    let selectedSector = 'general';

    function renderSectors() {
      const grid = document.getElementById('sectorGrid');
      grid.innerHTML = '';
      SECTORS.forEach(s => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = s.label;
        btn.dataset.value = s.value;
        btn.className = `sector-btn px-3 py-2 rounded-lg border text-sm font-medium transition text-left
          ${s.value === selectedSector
            ? 'border-indigo-500 bg-indigo-50 text-indigo-700'
            : 'border-gray-200 text-gray-600 hover:border-indigo-300'}`;
        btn.addEventListener('click', () => {
          selectedSector = s.value;
          document.getElementById('selectedSector').value = s.value;
          renderSectors();
        });
        grid.appendChild(btn);
      });
    }

    renderSectors();

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard';
    }

    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.classList.add('hidden');

      const payload = {
        full_name: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        sector: selectedSector,
      };

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.detail || 'Registration failed. Please try again.';
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Create account & continue to payment →';
          return;
        }

        // Save token
        localStorage.setItem('token', data.access_token);

        // Go to Stripe checkout
        btn.textContent = 'Redirecting to payment…';
        const checkoutRes = await fetch('/api/stripe/create-checkout-session', {
          method: 'POST',
          headers: { Authorization: `Bearer ${data.access_token}` },
        });
        const checkoutData = await checkoutRes.json();

        if (checkoutData.checkout_url) {
          window.location.href = checkoutData.checkout_url;
        } else {
          window.location.href = '/dashboard';
        }

      } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create account & continue to payment →';
      }
    });
  </script>
</body>
</html>
